
# ==================================================
# MARAV - CONFIGURACION DE LA APLICACION
# ==================================================

spring.application.name=MARAV


# ==================================================
# BASE DE DATOS MYSQL
# ==================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eco_market?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}


# ==================================================
# CORREO - RESEND
# ==================================================

RESEND_API_KEY=${RESEND_API_KEY:}
RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# URL publica de MARAV
APP_BASE_URL=${APP_BASE_URL:https://marav-production.up.railway.app}


# ==================================================
# SERVIDOR
# ==================================================

server.port=${PORT:8080}


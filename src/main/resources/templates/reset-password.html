<!DOCTYPE html>
<html lang="es">

<head>

    <!-- ========================================= -->
    <!-- CONFIGURACIÓN -->
    <!-- ========================================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Nueva Contraseña | MARAV
    </title>

    <!-- ========================================= -->
    <!-- FUENTE -->
    <!-- ========================================= -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
          rel="stylesheet">

    <!-- ========================================= -->
    <!-- CSS PRINCIPAL -->
    <!-- ========================================= -->

    <link rel="stylesheet"
          href="/css/login.css">

    <!-- ========================================= -->
    <!-- ESTILOS PASSWORD -->
    <!-- ========================================= -->

    <style>

        .password-box{
            position:relative;
            width:100%;
            margin-bottom:12px;
        }

        .password-box input{
            width:100%;
            padding:12px;
            padding-right:50px;
        }

        .toggle-password{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:20px;
            user-select:none;
        }

        .mensaje{
            text-align:center;
            color:#666;
            font-size:14px;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<!-- ========================================= -->
<!-- SLIDER -->
<!-- ========================================= -->

<div class="slider">

    <div class="slide slide1 active">

        <div class="overlay"></div>

        <div class="text">
            Tu negocio protegido con EcoMarket PRO
        </div>

    </div>

    <div class="slide slide2">

        <div class="overlay"></div>

        <div class="text">
            Seguridad para tus ventas e inventario
        </div>

    </div>

    <div class="slide slide3">

        <div class="overlay"></div>

        <div class="text">
            Recupera el acceso de forma segura
        </div>

    </div>

</div>

<!-- ========================================= -->
<!-- PANEL DERECHO -->
<!-- ========================================= -->

<div class="panel">

    <div class="box">

        <!-- ========================================= -->
        <!-- LOGO -->
        <!-- ========================================= -->

        <div class="logo">

            <img src="/images/logo.png"
                 alt="EcoMarket Logo">

        </div>

        <!-- ========================================= -->
        <!-- TITULO -->
        <!-- ========================================= -->

        <h2 style="
            text-align:center;
            color:#166534;
            margin-top:15px;
            margin-bottom:15px;
        ">
            Nueva contraseña
        </h2>

        <p class="mensaje">
            Ingresa una nueva contraseña para recuperar
            el acceso a tu cuenta.
        </p>

        <!-- ========================================= -->
        <!-- FORMULARIO -->
        <!-- ========================================= -->

        <form id="resetForm"
              action="/guardar-password"
              method="post">

            <!-- TOKEN -->

            <input
                    type="hidden"
                    name="token"
                    th:value="${token}">

            <!-- NUEVA PASSWORD -->

            <div class="password-box">

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nueva contraseña"
                        required>

                <span
                        class="toggle-password"
                        onclick="togglePassword('password', this)">
                    👁️
                </span>

            </div>

            <!-- CONFIRMAR PASSWORD -->

            <div class="password-box">

                <input
                        type="password"
                        id="confirmar"
                        placeholder="Confirmar contraseña"
                        required>

                <span
                        class="toggle-password"
                        onclick="togglePassword('confirmar', this)">
                    👁️
                </span>

            </div>

            <!-- BOTÓN -->

            <button type="submit">

                Guardar contraseña

            </button>

            <!-- VOLVER -->

            <div class="toggle">

                <a href="/login"
                   style="
                   text-decoration:none;
                   color:#2563eb;
                   ">

                    Volver al login

                </a>

            </div>

        </form>

    </div>

</div>

<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script>

    // =========================================
    // SLIDER
    // =========================================

    let slides =
        document.querySelectorAll(".slide");

    let index = 0;

    setInterval(() => {

        slides[index]
            .classList.remove("active");

        index =
            (index + 1) % slides.length;

        slides[index]
            .classList.add("active");

    }, 5000);

    // =========================================
    // MOSTRAR / OCULTAR PASSWORD
    // =========================================

    function togglePassword(id, icono){

        const input =
            document.getElementById(id);

        if(input.type === "password"){

            input.type = "text";

            icono.innerHTML = "🙈";

        }else{

            input.type = "password";

            icono.innerHTML = "👁️";

        }

    }

    // =========================================
    // VALIDAR PASSWORDS
    // =========================================

    document
        .getElementById("resetForm")
        .addEventListener("submit", function(e){

            let password =
                document.getElementById("password").value;

            let confirmar =
                document.getElementById("confirmar").value;

            if(password !== confirmar){

                e.preventDefault();

                alert(
                    "Las contraseñas no coinciden"
                );

            }

        });

</script>

</body>

</html>

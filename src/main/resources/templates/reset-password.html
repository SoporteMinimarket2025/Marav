
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- ========================================= -->
    <!-- CONFIGURACIÓN -->
    <!-- ========================================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nueva Contraseña | MARAV</title>

    <!-- ========================================= -->
    <!-- FUENTE -->
    <!-- ========================================= -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
          rel="stylesheet">

    <!-- ========================================= -->
    <!-- CSS PRINCIPAL -->
    <!-- ========================================= -->

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

    <!-- ========================================= -->
    <!-- ESTILOS PASSWORD -->
    <!-- ========================================= -->

    <style>

        .password-box {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-box input {
            width: 100%;
            padding: 12px;
            padding-right: 50px;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }

        .mensaje {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .mensaje-error {
            display: none;
            color: #dc2626;
            text-align: center;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .mensaje-error.visible {
            display: block;
        }

        .logo img {
            max-width: 150px;
            height: auto;
            object-fit: contain;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

    </style>

</head>

<body>

<!-- ========================================= -->
<!-- SLIDER -->
<!-- ========================================= -->

<div class="slider">

    <div class="slide slide1 active">

        <div class="overlay"></div>

        <div class="text">
            Tu negocio protegido con MARAV
        </div>

    </div>

    <div class="slide slide2">

        <div class="overlay"></div>

        <div class="text">
            Seguridad para tus ventas e inventario
        </div>

    </div>

    <div class="slide slide3">

        <div class="overlay"></div>

        <div class="text">
            Recupera el acceso de forma segura
        </div>

    </div>

</div>

<!-- ========================================= -->
<!-- PANEL DERECHO -->
<!-- ========================================= -->

<div class="panel">

    <div class="box">

        <!-- LOGO -->

        <div class="logo">

            <img src="/images/logo.png"
                 alt="MARAV">

        </div>

        <!-- TÍTULO -->

        <h2 style="
            text-align:center;
            color:#166534;
            margin-top:15px;
            margin-bottom:15px;
        ">
            Nueva contraseña
        </h2>

        <p class="mensaje">
            Ingresa una nueva contraseña para recuperar
            el acceso a tu cuenta.
        </p>

        <!-- ========================================= -->
        <!-- FORMULARIO -->
        <!-- ========================================= -->

        <form id="resetForm"
              th:action="@{/guardar-password}"
              method="post">

            <!-- TOKEN DE RECUPERACIÓN -->

            <input
                    type="hidden"
                    name="token"
                    th:value="${token}">

            <!-- NUEVA CONTRASEÑA -->

            <div class="password-box">

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nueva contraseña"
                        autocomplete="new-password"
                        required>

                <span
                        class="toggle-password"
                        onclick="togglePassword('password', this)">
                    👁️
                </span>

            </div>

            <!-- CONFIRMAR CONTRASEÑA -->

            <div class="password-box">

                <input
                        type="password"
                        id="confirmar"
                        placeholder="Confirmar contraseña"
                        autocomplete="new-password"
                        required>

                <span
                        class="toggle-password"
                        onclick="togglePassword('confirmar', this)">
                    👁️
                </span>

            </div>

            <!-- MENSAJE DE ERROR -->

            <p id="mensajeError"
               class="mensaje-error">
                Las contraseñas no coinciden.
            </p>

            <!-- BOTÓN -->

            <button type="submit"
                    id="btnGuardar">

                Guardar contraseña

            </button>

            <!-- VOLVER -->

            <div class="toggle">

                <a href="/login"
                   style="
                       text-decoration:none;
                       color:#2563eb;
                   ">

                    Volver al login

                </a>

            </div>

        </form>

    </div>

</div>

<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script>

    // =========================================
    // SLIDER
    // =========================================

    const slides = document.querySelectorAll(".slide");

    let index = 0;

    if (slides.length > 1) {

        setInterval(() => {

            slides[index].classList.remove("active");

            index = (index + 1) % slides.length;

            slides[index].classList.add("active");

        }, 5000);

    }

    // =========================================
    // MOSTRAR / OCULTAR CONTRASEÑA
    // =========================================

    function togglePassword(id, icono) {

        const input = document.getElementById(id);

        if (input.type === "password") {

            input.type = "text";
            icono.innerHTML = "👁️";

        } else {

            input.type = "password";
            icono.innerHTML = "👁️";

        }

    }

    // =========================================
    // VALIDAR CONTRASEÑAS
    // =========================================

    document
        .getElementById("resetForm")
        .addEventListener("submit", function(e) {

            const password =
                document.getElementById("password").value;

            const confirmar =
                document.getElementById("confirmar").value;

            const mensaje =
                document.getElementById("mensajeError");

            const boton =
                document.getElementById("btnGuardar");

            if (password !== confirmar) {

                e.preventDefault();

                mensaje.classList.add("visible");

                mensaje.textContent =
                    "Las contraseñas no coinciden.";

                return;

            }

            mensaje.classList.remove("visible");

            boton.disabled = true;

            boton.textContent = "Guardando...";

        });

</script>

</body>
</html>
